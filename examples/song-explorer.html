<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Explorer &ndash; Phish.net API Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <h1>Song Explorer</h1>
      <p>Search every song Phish has played and see its full history</p>
      <nav>
        <a href="../index.html">Home</a>
        <a href="latest-setlist.html">Latest Setlist</a>
        <a href="setlist-browser.html">Setlist Browser</a>
        <a href="song-explorer.html" class="active">Song Explorer</a>
        <a href="jam-charts.html">Jam Charts</a>
        <a href="venue-explorer.html">Venue Explorer</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="search-bar">
      <input type="text" id="filter" placeholder="Filter songs&hellip;" autocomplete="off">
    </div>
    <div class="scroll-list" id="song-list"><span class="status">Loading songs&hellip;</span></div>
    <div id="song-title"></div>
    <div id="results"></div>
  </main>

  <footer class="site-footer">
    Data provided by <a href="https://phish.net">Phish.net</a> &middot;
    <a href="https://docs.phish.net">API Docs</a>
  </footer>

  <script src="../scripts/phishnet-client.js"></script>
  <script src="../scripts/setlist-format.js"></script>
  <script src="js/song-explorer.js"></script>
</body>
</html>
