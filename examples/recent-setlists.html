<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latest Setlist – Phish.net API Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header>
    <h1>Phish.net API Demo</h1>
    <p>Pulling the latest setlist via the public API</p>
  </header>

  <main>
    <div id="setlist">Loading…</div>
  </main>

  <footer>
    Data provided by <a href="https://phish.net">Phish.net</a> &middot;
    <a href="https://docs.phish.net">API Docs</a>
  </footer>

  <script src="../scripts/apikey.js"></script>
  <script>
    const setLabels = { '1': 'Set 1', '2': 'Set 2', '3': 'Set 3', 'e': 'Encore', 'e2': 'Encore 2' };

    fetch('https://api.phish.net/v5/setlists/showyear/'+new Date().getFullYear()+'?apikey='+apikey)
      .then(r => r.json())
      .then(json => {
        const el = document.getElementById('setlist');
        const data = json.data;
        if (!Array.isArray(data) || !data.length) {
          el.textContent = 'No setlist data available.';
          return;
        }

        // group rows by show, then by set within each show (Phish only)
        const shows = new Map();
        data.filter(row => row.artistid === 1).forEach(row => {
          if (!shows.has(row.showid)) shows.set(row.showid, []);          shows.get(row.showid).push(row);
        });

        let html = '';
        let showIndex = 0;
        for (const [, rows] of [...shows].reverse()) {
          if (showIndex > 0) html += '<div class="show-separator"></div>';
          showIndex++;
          const first = rows[0];
          const permalink = first.permalink.startsWith('http')
            ? first.permalink
            : 'https://phish.net/setlists/' + first.permalink;

          html += `<h3>${first.showdate} &mdash; <a href="${permalink}">${first.venue}</a> <span class="show-location">${first.city}, ${first.state}${first.country !== 'USA' ? ', ' + first.country : ''}</span></h3>`;

          // group songs by set
          const sets = {};
          rows.forEach(row => {
            if (!sets[row.set]) sets[row.set] = [];
            sets[row.set].push(row);
          });

          for (const [key, songs] of Object.entries(sets)) {
            const label = setLabels[key] || 'Set ' + key;
            const songLine = songs.map((s, i) => {
              const next = songs[i + 1];
              const sep = next ? s.trans_mark || ', ' : '';
              return `<a href="https://phish.net/song/${s.slug}">${s.song}</a>` + sep;
            }).join('');
            html += `<h4>${label}</h4><p class="pnetsl">${songLine}</p>`;
          }

          const notes = first.setlistnotes?.trim();
          if (notes) {
            html += `<p class="pnetsn">${notes}</p>`;
          }
        }

        el.innerHTML = `<div id="pnetsetlist">${html}</div>`;
      })
      .catch(err => {
        document.getElementById('setlist').textContent = 'Failed to load setlist.';
        console.error('Failed to load setlist:', err);
      });
  </script>
</body>
</html>
