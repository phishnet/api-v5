<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jam Chart Explorer – Phish.net API Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .search-bar { display: flex; gap: 0.5rem; margin-bottom: 2rem; }
    .search-bar input { flex: 1; font-family: 'Inter', sans-serif; font-size: 0.9rem; border: 1px solid #ddd; border-radius: 6px; padding: 0.5rem 0.9rem; outline: none; transition: border-color 0.2s; }
    .search-bar input:focus { border-color: #111; }
    .search-bar button { font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 500; background: #111; color: #fff; border: none; border-radius: 6px; padding: 0.5rem 1.4rem; cursor: pointer; transition: background 0.15s; }
    .search-bar button:hover { background: #333; }
    .song-list { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 2rem; transition: max-height 0.3s ease; overflow: hidden; }
    .song-list.collapsed { max-height: 0; margin-bottom: 0; }
    .song-list a { font-size: 0.8rem; padding: 0.25rem 0.6rem; border-radius: 4px; background: #f0f0f0; color: #333; text-decoration: none; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .song-list a:hover, .song-list a.active { background: #111; color: #fff; }
    .toggle-songs { font-family: 'Inter', sans-serif; font-size: 0.8rem; color: #999; cursor: pointer; background: none; border: none; padding: 0; margin-bottom: 1.5rem; display: none; transition: color 0.15s; }
    .toggle-songs:hover { color: #111; }
    .jam-entry { margin-bottom: 1.8rem; padding-bottom: 1.8rem; border-bottom: 1px solid #eee; }
    .jam-entry:last-child { border-bottom: none; }
    .jam-entry h3 { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 500; margin-bottom: 0.3rem; }
    .jam-entry h3 a { color: #111; text-decoration: none; border-bottom: 1px solid rgba(0,0,0,0.15); transition: border-color 0.2s; }
    .jam-entry h3 a:hover { border-color: #111; }
    .jam-meta { font-size: 0.8rem; color: #999; margin-bottom: 0.5rem; }
    .jam-desc { font-size: 0.9rem; line-height: 1.7; color: #444; }
    .status { font-size: 0.9rem; color: #999; }
    #song-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 1.5rem; }
    #song-title a { color: #111; text-decoration: none; border-bottom: 1px solid rgba(0,0,0,0.15); }
  </style>
</head>
<body>
  <header>
    <div style="max-width:900px;margin:0 auto;">
      <h1>Jam Chart Explorer</h1>
      <p>Browse notable jams via the Phish.net API</p>
    </div>
  </header>

  <main>
    <div class="search-bar">
      <input type="text" id="filter" placeholder="Filter songs…" autocomplete="off">
    </div>
    <div class="song-list" id="song-list"><span class="status">Loading songs…</span></div>
    <button class="toggle-songs" id="toggle-songs" onclick="toggleSongList()">▸ Change song</button>
    <div id="song-title"></div>
    <div id="results"></div>
  </main>

  <footer>
    Data provided by <a href="https://phish.net">Phish.net</a> &middot;
    <a href="https://docs.phish.net">API Docs</a>
  </footer>

  <script src="../scripts/apikey.js"></script>
  <script>
    const songListEl = document.getElementById('song-list');
    const resultsEl = document.getElementById('results');
    const titleEl = document.getElementById('song-title');
    const filterEl = document.getElementById('filter');
    let allSongs = [];

    // Load jam chart songs directly from jamcharts endpoint
    fetch('https://api.phish.net/v5/jamcharts.json?apikey=' + apikey)
      .then(r => r.json())
      .then(json => {
        // dedupe by slug to build the song picker
        const seen = new Set();
        allSongs = (json.data || []).reduce((acc, j) => {
          if (!seen.has(j.slug)) {
            seen.add(j.slug);
            acc.push({ slug: j.slug, song: j.song });
          }
          return acc;
        }, []).sort((a, b) => a.song.localeCompare(b.song));
        renderSongList('');
      })
      .catch(() => {
        songListEl.innerHTML = '<span class="status">Failed to load songs.</span>';
      });

    function renderSongList(filter) {
      const lower = filter.toLowerCase();
      const filtered = lower
        ? allSongs.filter(s => s.song.toLowerCase().includes(lower))
        : allSongs;
      if (!filtered.length) {
        songListEl.innerHTML = '<span class="status">No matching songs.</span>';
        return;
      }
      songListEl.innerHTML = filtered.map(s =>
        `<a data-slug="${s.slug}" onclick="loadJamChart('${s.slug}','${s.song.replace(/'/g, "\\'")}')">${s.song}</a>`
      ).join('');
    }

    filterEl.addEventListener('input', () => renderSongList(filterEl.value));

    function loadJamChart(slug, name) {
      // collapse song list and show toggle
      songListEl.classList.add('collapsed');
      filterEl.parentElement.style.display = 'none';
      const toggleBtn = document.getElementById('toggle-songs');
      toggleBtn.style.display = 'block';

      titleEl.innerHTML = `<a href="https://phish.net/song/${slug}">${name}</a> — Jam Chart`;
      resultsEl.innerHTML = '<span class="status">Loading…</span>';

      // scroll to top so results are visible
      titleEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

      fetch('https://api.phish.net/v5/jamcharts/slug/' + slug + '.json?apikey=' + apikey)
        .then(r => r.json())
        .then(json => {
          const data = json.data;
          if (!Array.isArray(data) || !data.length) {
            resultsEl.innerHTML = '<span class="status">No jam chart entries found.</span>';
            return;
          }
          resultsEl.innerHTML = data.map(j => `
            <div class="jam-entry">
              <h3><a href="${j.permalink || 'https://phish.net/setlists/phish-' + j.showdate}">${j.showdate}</a></h3>
              <div class="jam-meta">${j.venue || ''}${j.city ? ', ' + j.city : ''}${j.state ? ', ' + j.state : ''}${j.tracktime ? ' &middot; ' + j.tracktime : ''}</div>
              ${j.jamchart_description ? '<div class="jam-desc">' + j.jamchart_description + '</div>' : ''}
            </div>
          `).join('');
        })
        .catch(() => {
          resultsEl.innerHTML = '<span class="status">Failed to load jam chart.</span>';
        });
    }
    function toggleSongList() {
      const collapsed = songListEl.classList.toggle('collapsed');
      filterEl.parentElement.style.display = collapsed ? 'none' : 'flex';
      document.getElementById('toggle-songs').textContent = collapsed ? '▸ Change song' : '▾ Hide songs';
    }
  </script>
</body>
</html>
